name: Build Sely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Sely Android APK
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Check ZIP
      # --------------------------------------------------
      - name: Check Sely ZIP
        run: |
          echo "Repository contents:"
          ls -lah

          if [ ! -f "SelyApp-redesigned.zip" ]; then
            echo "ERROR: SelyApp-redesigned.zip was not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Sely ZIP found:"
          ls -lh SelyApp-redesigned.zip

      # --------------------------------------------------
      # 3. Extract project
      # --------------------------------------------------
      - name: Extract Sely project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q -o SelyApp-redesigned.zip -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | sort | head -300

      # --------------------------------------------------
      # 4. Find Android Gradle project
      # --------------------------------------------------
      - name: Find Gradle project
        run: |
          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."

            echo "Project structure:"
            find project -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Setup Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 6. Setup Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 7. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # --------------------------------------------------
      # 8. Inspect project
      # --------------------------------------------------
      - name: Inspect Sely project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \
            -o -name "gradlew" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # --------------------------------------------------
      # 9. Make gradlew executable
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found in the Sely project."

            echo "Files in project:"
            find . -maxdepth 4 -type f | sort

            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper found:"
          ./gradlew --version

      # --------------------------------------------------
      # 10. Configure AndroidX
      # --------------------------------------------------
      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          fi

          echo ""
          echo "Final gradle.properties:"
          cat gradle.properties

      # --------------------------------------------------
      # 11. Clean project
      # --------------------------------------------------
      - name: Clean Sely project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --stacktrace

      # --------------------------------------------------
      # 12. Build APK
      # --------------------------------------------------
      - name: Build Sely Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # --------------------------------------------------
      # 13. Find APK
      # --------------------------------------------------
      - name: Find generated APK
        run: |
          echo "Searching for APK..."

          find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "${PROJECT_DIR}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No APK was generated."

            echo ""
            echo "Build output:"
            find "${PROJECT_DIR}/app/build" \
              -maxdepth 6 \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 14. Upload APK as artifact
      # --------------------------------------------------
      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # --------------------------------------------------
      # 15. Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

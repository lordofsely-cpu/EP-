name: Build Sely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Sely Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "Files in repository:"
          ls -lah
          test -f SelyApp-redesigned.zip

      - name: Extract Sely project
        run: |
          rm -rf project
          mkdir project
          unzip -q -o SelyApp-redesigned.zip -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Enable AndroidX
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Check Gradle project
        working-directory: project
        run: |
          echo "Root:"
          ls -lah
          echo "App:"
          ls -lah app

      - name: Build Sely APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Check APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Sely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Sely Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Sely ZIP
        run: |
          echo "Repository files:"
          ls -lah
          test -f SelyApp-redesigned.zip

      - name: Extract Sely project
        run: |
          rm -rf project
          mkdir project
          unzip -q -o SelyApp-redesigned.zip -d project

          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses || true

      - name: Install Android SDK requirements
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          echo "gradle.properties:"
          cat gradle.properties

      - name: Inspect Gradle project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -lah

          echo "App directory:"
          ls -lah app

      - name: Build Sely APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find "${PROJECT_DIR}/app/build/outputs" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

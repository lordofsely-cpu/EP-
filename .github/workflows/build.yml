name: Build Sely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Sely Android APK
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Get repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Check ZIP
      # --------------------------------------------------
      - name: Check Sely ZIP
        run: |
          echo "Repository contents:"
          ls -lah

          if [ ! -f "SelyApp-redesigned.zip" ]; then
            echo "ERROR: SelyApp-redesigned.zip was not found."
            exit 1
          fi

          echo "SelyApp-redesigned.zip found."

      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract Sely project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q -o SelyApp-redesigned.zip -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | sort

      # --------------------------------------------------
      # 4. Find Android project
      # --------------------------------------------------
      - name: Locate Gradle project
        shell: bash
        run: |
          SETTINGS_FILE=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Android command-line tools
      # --------------------------------------------------
      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # --------------------------------------------------
      # 7. Verify Android SDK
      # --------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Checking sdkmanager..."
          command -v sdkmanager

          sdkmanager --version

      # --------------------------------------------------
      # 8. Accept licenses
      # --------------------------------------------------
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # --------------------------------------------------
      # 9. Install exact SDK used by Sely
      # --------------------------------------------------
      - name: Install Android SDK 34
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # --------------------------------------------------
      # 10. Install Gradle
      # --------------------------------------------------
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      # --------------------------------------------------
      # 11. Configure AndroidX
      # --------------------------------------------------
      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "gradle.properties:"
          cat gradle.properties

      # --------------------------------------------------
      # 12. Check Sely project
      # --------------------------------------------------
      - name: Inspect Sely project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "================================"
          echo "Sely project"
          echo "================================"

          pwd
          ls -lah

          echo "================================"
          echo "App directory"
          echo "================================"

          ls -lah app

          echo "================================"
          echo "Gradle configuration"
          echo "================================"

          cat build.gradle
          echo ""
          cat app/build.gradle

      # --------------------------------------------------
      # 13. Fix auto:tint only if it exists
      # --------------------------------------------------
      - name: Fix invalid auto tint attributes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Searching for auto:tint..."

          if grep -RIn "auto:tint" app/src/main/res; then

            echo ""
            echo "auto:tint found."
            echo "Replacing auto:tint with android:tint..."

            find app/src/main/res \
              -type f \
              -name "*.xml" \
              -print0 |
            while IFS= read -r -d '' file; do
              sed -i 's/auto:tint/android:tint/g' "$file"
            done

          else

            echo "No auto:tint found."
            echo "No XML changes required."

          fi

          echo ""
          echo "Remaining auto:tint references:"
          grep -RIn "auto:tint" app/src/main/res || true

      # --------------------------------------------------
      # 14. Build APK
      # --------------------------------------------------
      - name: Build Sely APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # --------------------------------------------------
      # 15. Find APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find "${PROJECT_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "================================"
          echo "Sely APK successfully created!"
          echo "================================"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 16. Upload APK
      # --------------------------------------------------
      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # --------------------------------------------------
      # 17. Create GitHub release
      # --------------------------------------------------
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sely-build-${{ github.run_number }}
          name: Sely APK Build ${{ github.run_number }}
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
